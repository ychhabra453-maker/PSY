name: Build Android APK (PSY Arena)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build & Release PSY-Arena.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Normalize package.json for Public npm & Build Web Assets
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "lucide-react": "^0.475.0"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.0",
              "@types/node": "^22.10.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.4",
              "tailwindcss": "^4.0.0",
              "typescript": "^5.7.2",
              "vite": "^6.1.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare PSY-Arena.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PSY-Arena.apk

      - name: Upload PSY-Arena.apk to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSY-Arena-APK
          path: PSY-Arena.apk
          if-no-files-found: error

      - name: Publish PSY-Arena.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "PSY Arena — Android APK"
          files: PSY-Arena.apk
          prerelease: false
