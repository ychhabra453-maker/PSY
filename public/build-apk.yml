name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build PSY-Arena.apk & Publish to Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Prepare Web Dependencies & Build PSY Bundle
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies = {
              "react": "^19.0.0",
              "react-dom": "^19.0.0",
              "lucide-react": "^0.475.0"
            };
            pkg.devDependencies = {
              "@tailwindcss/vite": "^4.0.9",
              "@types/node": "^22.10.0",
              "@types/react": "^19.0.0",
              "@types/react-dom": "^19.0.0",
              "@vitejs/plugin-react": "^4.3.4",
              "tailwindcss": "^4.0.9",
              "typescript": "^5.7.3",
              "vite": "^6.2.0"
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            if (fs.existsSync("vite.config.ts")) {
              const vc = fs.readFileSync("vite.config.ts", "utf8").replace(/__dirname,\s*\x27\.\x27/g, "\x27.\x27");
              fs.writeFileSync("vite.config.ts", vc);
            }
          '
          npm install --legacy-peer-deps
          npm run build

      - name: Add Capacitor Android & Sync Web Assets
        run: |
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 --save --legacy-peer-deps
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Compile Android APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to PSY-Arena.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PSY-Arena.apk
          ls -lh PSY-Arena.apk

      - name: Upload PSY-Arena.apk to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PSY-Arena-APK
          path: PSY-Arena.apk
          if-no-files-found: error

      - name: Publish PSY-Arena.apk to GitHub Releases Tab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0.0
          git push origin v1.0.0 --force
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 PSY-Arena.apk --clobber
          else
            gh release create v1.0.0 PSY-Arena.apk --title "PSY Arena v1.0.0 (Android APK)" --notes "Download PSY-Arena.apk below under Assets and install on your Android device."
          fi
